[project]
name = "rs-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pymongo>=4.15.0",
    "pyyaml>=6.0.3",
    "xlsxwriter>=3.2.9",
]

[tool.ruff]  # Ruff 的主配置区域
line-length = 120           # 最大行宽限制（和 Black 一样是 88，太长会自动换行）
indent-width = 4           # 缩进宽度，4 个空格（代替 .editorconfig 的 indent_size）
target-version = "py39"   # 目标 Python 版本（用于识别新语法，比如 match case）

[tool.ruff.lint]
select = ["E", "F", "I", "D"]  # 启用哪些规则集：E = pycodestyle（PEP8），F = pyflakes（未使用变量等），I = isort（import 顺序），D = pydocstyle（空行/注释规范）
ignore = ["D203"]          # 忽略规则 D203（和 D211 冲突，只保留一个函数空行规则）

[tool.ruff.format]         # Ruff 的格式化行为（相当于 Black 的配置）
quote-style = "single"     # 强制使用单引号（替代 Black 的双引号限制）
indent-style = "space"     # 强制使用空格缩进（替代 tab）
line-ending = "lf"         # 使用 UNIX 换行（避免 Windows 的 \r\n 问题）

